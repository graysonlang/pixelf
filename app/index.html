<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b0d">
  <title>Pixelf</title>
  <link rel="stylesheet" href="./main.css">
  <script src="./main.js" type="module"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Main menu"
        aria-controls="app-menu"
        aria-expanded="false"
      >
        <svg class="menu-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
        </svg>
      </button>
      <input id="image-input" class="visually-hidden" type="file" accept="image/*">
      <nav id="app-menu" class="app-menu" aria-label="Main menu" hidden>
        <button class="menu-item" type="button" data-action="open-image">
          <span>Open image...</span>
        </button>
        <button id="save-project-button" class="menu-item" type="button" data-action="save-project" disabled>
          <span>Save project</span>
        </button>
        <label class="menu-select">
          <span>Export metadata</span>
          <select id="metadata-policy">
            <option value="discard">Discard</option>
            <option value="preserve">Preserve</option>
            <option value="rewrite">Rewrite</option>
          </select>
        </label>
        <button id="export-button" class="menu-item" type="button" data-action="export-target" disabled>
          <span>Export target</span>
        </button>
        <div class="menu-separator" aria-hidden="true"></div>
        <button class="menu-item" type="button" data-action="undo" disabled>
          <span>Undo</span>
        </button>
        <button class="menu-item" type="button" data-action="redo" disabled>
          <span>Redo</span>
        </button>
        <div class="menu-separator" aria-hidden="true"></div>
        <button id="quick-actions-button" class="menu-item" type="button">
          <span>Quick actions...</span>
          <kbd>Cmd/Ctrl+/</kbd>
        </button>
      </nav>
    </header>

    <section class="workspace" aria-label="Image workspace">
      <aside class="layers-panel">
        <div class="panel-heading">
          <div>
            <h1 id="source-name">Untitled image</h1>
            <p id="source-details" class="source-details">No source selected</p>
          </div>
          <fieldset class="history-actions">
            <legend class="visually-hidden">History</legend>
            <button id="undo-button" type="button" title="Undo" disabled>Undo</button>
            <button id="redo-button" type="button" title="Redo" disabled>Redo</button>
          </fieldset>
        </div>
        <fieldset class="tree-actions">
          <legend class="visually-hidden">Layer actions</legend>
          <button id="add-layer-button" type="button" disabled>+ Layer</button>
          <label class="operation-picker">
            <span class="visually-hidden">Operation type</span>
            <select id="operation-type" aria-label="Operation type"></select>
          </label>
          <button id="add-operation-button" type="button" disabled>+ Operation</button>
          <button id="add-mask-button" type="button" disabled>+ Mask</button>
          <button id="duplicate-button" type="button" disabled>Duplicate</button>
          <button id="move-up-button" type="button" title="Move layer up" disabled>Up</button>
          <button id="move-down-button" type="button" title="Move layer down" disabled>Down</button>
          <button id="delete-button" type="button" disabled>Delete</button>
        </fieldset>
        <div id="layer-tree" class="layer-tree" role="tree" aria-label="Target-first layers"></div>
        <p id="gpu-status" class="gpu-status" role="status" hidden></p>
      </aside>

      <section class="stage-column">
        <fieldset class="stage-toolbar">
          <legend class="visually-hidden">Preview controls</legend>
          <button id="fit-button" type="button">Fit</button>
          <button id="actual-size-button" type="button">100%</button>
          <button id="zoom-out-button" type="button" aria-label="Zoom out">-</button>
          <output id="zoom-output" aria-live="polite">100%</output>
          <button id="zoom-in-button" type="button" aria-label="Zoom in">+</button>
          <button id="pan-left-button" type="button" aria-label="Pan left">Left</button>
          <button id="pan-right-button" type="button" aria-label="Pan right">Right</button>
          <button id="pan-up-button" type="button" aria-label="Pan up">Up</button>
          <button id="pan-down-button" type="button" aria-label="Pan down">Down</button>
          <button id="pixel-grid-button" type="button" aria-pressed="false">Pixel grid</button>
          <button id="transparency-button" type="button" aria-pressed="true">Transparency</button>
          <button id="compare-button" type="button">Hold to compare</button>
        </fieldset>
        <section id="stage" class="stage" aria-label="Image preview">
          <div id="stage-content" class="stage-content">
            <canvas id="gpu-preview" aria-label="Processed WebGPU preview" hidden></canvas>
            <img id="image-preview" alt="Original source preview" hidden>
          </div>
        </section>
      </section>

      <aside id="properties-panel" class="properties-panel" aria-label="Properties">
        <p class="properties-empty">Select a target, layer, operation, or source to inspect it.</p>
      </aside>
    </section>
  </main>

  <div id="quick-actions-overlay" class="quick-actions-overlay" aria-hidden="true" inert>
    <section class="quick-actions-palette" role="dialog" aria-modal="true" aria-labelledby="quick-actions-title">
      <h2 id="quick-actions-title" class="visually-hidden">Quick actions</h2>
      <input
        id="quick-actions-input"
        type="search"
        placeholder="Search actions..."
        autocomplete="off"
        spellcheck="false"
      >
      <div id="quick-actions-results" class="quick-actions-results"></div>
    </section>
  </div>
</body>
</html>
