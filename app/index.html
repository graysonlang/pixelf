<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b0d">
  <title>Pixelf</title>
  <link rel="stylesheet" href="./main.css">
  <script src="./main.js" type="module"></script>
</head>
<body>
  <main class="app-shell">
    <input id="image-input" class="visually-hidden" type="file" accept="image/*">
    <nav id="app-menu" class="app-menu" aria-label="Main menu" hidden>
      <button class="menu-item" type="button" data-action="open-image">
        <span>Open image...</span>
        <kbd>&#8679;O</kbd>
      </button>
      <button id="save-project-button" class="menu-item" type="button" data-action="save-project" disabled>
        <span>Save composite</span>
      </button>
      <button id="export-button" class="menu-item" type="button" data-action="export-target" disabled>
        <span>Export composite...</span>
      </button>
      <div class="menu-separator" aria-hidden="true"></div>
      <button id="undo-button" class="menu-item" type="button" data-action="undo" disabled>
        <span>Undo</span>
        <kbd id="undo-shortcut">&#8984;Z</kbd>
      </button>
      <button id="redo-button" class="menu-item" type="button" data-action="redo" disabled>
        <span>Redo</span>
        <kbd id="redo-shortcut">&#8679;&#8984;Z</kbd>
      </button>
      <button id="history-button" class="menu-item" type="button" data-action="history" disabled>
        <span>History...</span>
        <kbd id="history-shortcut">&#8984;Y</kbd>
      </button>
      <div class="menu-separator" aria-hidden="true"></div>
      <button class="menu-item" type="button" data-action="settings">
        <span>Settings...</span>
        <kbd id="settings-shortcut">&#8984;,</kbd>
      </button>
      <button id="quick-actions-button" class="menu-item" type="button">
        <span>Quick actions...</span>
        <kbd id="quick-actions-shortcut">&#8984;/</kbd>
      </button>
    </nav>
    <section id="zoom-menu" class="zoom-menu" aria-label="Zoom" hidden>
      <button id="fit-button" class="zoom-menu-item" type="button">
        <span>Zoom to fit</span>
        <kbd>&#8679;1</kbd>
      </button>
      <button id="actual-size-button" class="zoom-menu-item" type="button">
        <span>Zoom to 100%</span>
        <kbd id="actual-size-shortcut">&#8984;0</kbd>
      </button>
      <label class="zoom-custom">
        <span class="zoom-input-wrap">
          <input id="zoom-input" type="text" inputmode="numeric" pattern="[0-9]*" value="100" aria-label="Zoom percentage">
          <span aria-hidden="true">%</span>
        </span>
      </label>
    </section>

    <section class="workspace" aria-label="Image workspace">
      <aside class="tool-rail" aria-label="Tools">
        <button
          id="menu-button"
          class="menu-button rail-button"
          type="button"
          aria-label="Main menu"
          aria-controls="app-menu"
          aria-expanded="false"
        >
          <svg class="menu-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
          </svg>
        </button>
        <div class="tool-rail-divider" aria-hidden="true"></div>
        <button class="rail-button tool-button" type="button" data-tool="move" aria-label="Move and select tool" aria-pressed="true" title="Move and select">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M1.43315 2.08257C1.27035 1.67467 1.67467 1.27035 2.08258 1.43315L14.6424 6.45662C15.0847 6.63378 15.0518 7.27101 14.5935 7.40193L9.26727 8.92343C9.10117 8.97088 8.97098 9.10107 8.92352 9.26718L7.40201 14.5934L7.37173 14.6744C7.20516 15.0289 6.69666 15.0549 6.49476 14.7194L6.45668 14.6422L1.43315 2.08257ZM6.84145 12.9117L7.96256 8.99178L8.02702 8.81112C8.20366 8.40083 8.556 8.08719 8.99188 7.96248L12.9119 6.84138L2.79548 2.79546L6.84145 12.9117Z" fill="currentColor"></path>
          </svg>
        </button>
        <button class="rail-button tool-button" type="button" data-tool="brush" aria-label="Brush tool" aria-pressed="false" title="Brush">
          <svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M13.8 2.5l3.7 3.7-8.3 8.3-3.7-3.7 8.3-8.3Z" fill="none" stroke="currentColor" stroke-width="1.4"></path>
            <path d="M8.2 13.5c-.4 2.8-2.1 4-5.2 4 1.5-1.5 1-3.1 2.2-4.3.8-.8 2-.7 3 .3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
          </svg>
        </button>
        <button class="rail-button tool-button" type="button" data-tool="eyedropper" aria-label="Eyedropper tool" aria-pressed="false" title="Eyedropper">
          <svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M11.5 3.5l5 5M13.8 6.2l1.4-1.4a1.8 1.8 0 0 1 2.5 2.5l-1.4 1.4M12.8 7.2l-7.2 7.2-.8 2.8 2.8-.8 7.2-7.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <fieldset class="paint-colors">
          <legend class="visually-hidden">Paint colors</legend>
          <div class="paint-color-stack">
            <label class="paint-color paint-color-background" title="Background color">
              <span class="visually-hidden">Background color</span>
              <input id="background-paint-color" type="color" value="#ffffff">
            </label>
            <label class="paint-color paint-color-foreground" title="Foreground color">
              <span class="visually-hidden">Foreground color</span>
              <input id="foreground-paint-color" type="color" value="#171b1e">
            </label>
          </div>
        </fieldset>
      </aside>

      <div class="zoom-hud">
        <button
          id="zoom-menu-button"
          class="zoom-menu-button"
          type="button"
          aria-label="Zoom options"
          aria-controls="zoom-menu"
          aria-expanded="false"
        >
          <span id="zoom-menu-label">100%</span>
        </button>
      </div>

      <aside class="layers-panel">
        <header class="layers-heading">
          <button
            id="add-menu-button"
            class="add-menu-button"
            type="button"
            aria-label="Add to composite"
            aria-controls="add-menu"
            aria-expanded="false"
            title="Add to composite"
          >
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
              <path d="M7 2v10M2 7h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
            </svg>
          </button>
        </header>
        <div id="layer-tree" class="layer-tree" role="tree" aria-label="Layers and composite"></div>
      </aside>

      <div
        id="structure-toolbar"
        class="structure-toolbar"
        role="menu"
        aria-label="Layer actions"
        hidden
      ></div>

      <div id="add-menu" class="add-menu" role="menu" aria-label="Add to composite" hidden>
        <button id="add-layer-button" class="add-menu-item" type="button" role="menuitem" disabled>
          <span>Layer</span>
          <small>Paint or imported pixels</small>
        </button>
        <button id="add-group-button" class="add-menu-item" type="button" role="menuitem" disabled>
          <span>Group</span>
          <small>Organize and scope layers</small>
        </button>
        <button id="add-content-layer-button" class="add-menu-item" type="button" role="menuitem" disabled>
          <span>Content Layer</span>
          <small>Fill, gradient, or pattern</small>
        </button>
        <button
          id="add-filter-layer-button"
          class="add-menu-item"
          type="button"
          role="menuitem"
          disabled
        >
          <span>Filter Layer</span>
          <small>Adjustment, blur, or clarity</small>
        </button>
        <div class="menu-separator" aria-hidden="true"></div>
        <button id="add-mask-button" class="add-menu-item" type="button" role="menuitem" disabled>
          <span>Mask on Selection</span>
          <small>Limit the selected layer or effect</small>
        </button>
      </div>

      <section class="stage-column">
        <section id="stage" class="stage" aria-label="Image preview">
          <canvas id="render-preview" aria-label="Edited image preview" hidden></canvas>
          <div id="stage-content" class="stage-content">
            <div id="render-preview-frame" class="render-preview-frame" aria-hidden="true" hidden></div>
            <img id="image-preview" alt="Original source preview" hidden>
          </div>
        </section>
        <p id="render-status" class="render-status" role="status" hidden></p>
      </section>

      <aside id="properties-panel" class="properties-panel" aria-label="Properties">
        <section id="canvas-properties" class="canvas-properties">
          <div class="properties-heading">
            <h2>Workspace</h2>
          </div>
          <fieldset class="canvas-view-options">
            <legend class="visually-hidden">Workspace background options</legend>
            <div class="canvas-view-row">
              <label class="property-label" for="canvas-background-mode">Background</label>
              <div class="canvas-background-controls">
                <select id="canvas-background-mode">
                  <option value="theme">Match theme</option>
                  <option value="light">Light</option>
                  <option value="dark">Dark</option>
                  <option value="custom">Custom</option>
                </select>
                <button
                  id="canvas-background-visibility"
                  class="canvas-background-visibility"
                  type="button"
                  aria-label="Hide background"
                  aria-pressed="true"
                  data-off="false"
                >
                  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M1.5 8C3.5 4.6 12.5 4.6 14.5 8C12.5 11.4 3.5 11.4 1.5 8Z" fill="none" stroke="currentColor" stroke-width="1.3"></path>
                    <circle class="eye-pupil" cx="8" cy="8" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3"></circle>
                    <path class="eye-slash" d="M3 13.5L13 2.5" fill="none" stroke="currentColor" stroke-width="1.3"></path>
                  </svg>
                </button>
              </div>
            </div>
            <label id="canvas-background-color-row" class="canvas-view-row" hidden>
              <span class="property-label">Color</span>
              <input id="canvas-background-color" type="color" value="#ffffff">
            </label>
          </fieldset>
        </section>
        <section
          id="selection-properties"
          class="selection-properties"
          aria-label="Selected item properties"
          tabindex="-1"
          hidden
        ></section>
      </aside>
    </section>
  </main>

  <div id="export-overlay" class="export-overlay" aria-hidden="true" inert>
    <section class="export-panel" role="dialog" aria-modal="true" aria-labelledby="export-title">
      <form id="export-form">
        <header class="export-heading">
          <h2 id="export-title">Export composite</h2>
          <button id="export-close-button" class="export-close-button" type="button" aria-label="Close export dialog">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
              <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
            </svg>
          </button>
        </header>
        <div class="export-body">
          <label class="export-field">
            <span>Format</span>
            <select id="export-format">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
          </label>
          <label class="export-field">
            <span>Metadata</span>
            <select id="metadata-policy">
              <option value="discard">Discard</option>
              <option value="preserve">Preserve</option>
              <option value="rewrite">Rewrite</option>
            </select>
          </label>
          <p id="export-summary" class="export-summary"></p>
          <p id="export-dialog-status" class="export-dialog-status" role="status" hidden></p>
        </div>
        <footer class="export-actions">
          <button id="export-cancel-button" type="button">Cancel</button>
          <button id="export-confirm-button" class="export-confirm-button" type="submit">Export</button>
        </footer>
      </form>
    </section>
  </div>

  <div id="quick-actions-overlay" class="quick-actions-overlay" aria-hidden="true" inert>
    <section class="quick-actions-palette" role="dialog" aria-modal="true" aria-labelledby="quick-actions-title">
      <h2 id="quick-actions-title" class="visually-hidden">Quick actions</h2>
      <input
        id="quick-actions-input"
        type="search"
        placeholder="Search actions..."
        autocomplete="off"
        spellcheck="false"
      >
      <div id="quick-actions-results" class="quick-actions-results"></div>
    </section>
  </div>

  <div id="history-overlay" class="history-overlay" aria-hidden="true" inert>
    <section class="history-panel" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <header class="history-heading">
        <h2 id="history-title">History</h2>
        <button id="history-close-button" class="history-close-button" type="button" aria-label="Close history">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
          </svg>
        </button>
      </header>
      <section id="history-list" class="history-list" aria-label="Composite history"></section>
    </section>
  </div>

  <div id="settings-overlay" class="settings-overlay" aria-hidden="true" inert>
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-heading">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close-button" class="settings-close-button" type="button" aria-label="Close settings">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"></path>
          </svg>
        </button>
      </header>
      <div class="settings-body">
        <fieldset class="settings-group">
          <legend>Appearance</legend>
          <label class="settings-row">
            <input type="radio" name="settings-theme" value="auto">
            <span>System</span>
          </label>
          <label class="settings-row">
            <input type="radio" name="settings-theme" value="light">
            <span>Light</span>
          </label>
          <label class="settings-row">
            <input type="radio" name="settings-theme" value="dark">
            <span>Dark</span>
          </label>
          <p class="settings-note">
            System follows the appearance selected in your operating system or browser.
          </p>
        </fieldset>
      </div>
    </section>
  </div>
</body>
</html>
